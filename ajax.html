<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AJAX CRUD</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Egyedi háttér -->
  <style>
    body {
      background: linear-gradient(100deg, #FF9A02, #FED404);
    }
  </style>
</head>
<body class="container py-4">
  <h1 class="text-center mb-4">AJAX CRUD alkalmazás</h1>

  <!-- Adatok betöltése 
  
  <div id="code" class="mb-3"></div>
  <div id="readDiv" class="mb-4"></div> -->
<!-- Adatok táblázatos megjelenítése -->

<div id="code" class="mb-3"></div>

<div id="code" class="mb-3"></div>
<!-- Egyéb olvasott adat (readDiv tartalom) -->
<div class="card mb-4">
  <div class="card-header bg-secondary text-white">Adat részletek</div>
  <div class="card-body">

    <div id="readDiv" class="text-start">
      <!-- Ide íródik a részletes adat -->
    </div>
  </div>
</div>



  <!-- Új adat létrehozása -->
  <div class="card mb-4">
    <div class="card-header bg-success text-white">Új adat hozzáadása</div>
    <div class="card-body">
      <div class="row g-2">
        <div class="col-md-4"><input id="name1" type="text" class="form-control" placeholder="Név (max 30)" maxlength="30"></div>
        <div class="col-md-4"><input id="city1" type="text" class="form-control" placeholder="Város (max 30)" maxlength="30"></div>
        <div class="col-md-4"><input id="phone1" type="text" class="form-control" placeholder="Telefon (max 30)" maxlength="30"></div>
      </div>
      <div class="mt-3">
        <button class="btn btn-success" onclick="create()">Létrehozás</button>
      </div>
      <div id="createResult" class="mt-2"></div>
    </div>
  </div>

  <!-- Adat módosítása -->
  <div class="card mb-4">
    <div class="card-header bg-info text-white">Adat módosítása</div>
    <div class="card-body">
      <div class="row g-2 mb-2">
        <div class="col-md-4"><input id="idUpd" type="text" class="form-control" placeholder="ID"></div>
        <div class="col-md-4">
          <button class="btn btn-secondary w-100" onclick="getDataForId()">Adat lekérése</button>
        </div>
      </div>
      <div class="row g-2">
        <div class="col-md-4"><input id="name2" type="text" class="form-control" placeholder="Új név (max 30)" maxlength="30"></div>
        <div class="col-md-4"><input id="city2" type="text" class="form-control" placeholder="Új város (max 30)" maxlength="30"></div>
        <div class="col-md-4"><input id="phone2" type="text" class="form-control" placeholder="Új telefon (max 30)" maxlength="30"></div>
      </div>
      <div class="mt-3">
        <button class="btn btn-info text-white" onclick="update()">Módosítás</button>
      </div>
      <div id="updateResult" class="mt-2"></div>
    </div>
  </div>

  <!-- Adat törlése -->
  <div class="card mb-4">
    <div class="card-header bg-danger text-white">Adat törlése</div>
    <div class="card-body">
      <div class="row g-2">
        <div class="col-md-6"><input id="idDel" type="text" class="form-control" placeholder="ID"></div>
        <div class="col-md-6">
          <button class="btn btn-danger w-100" onclick="deleteF()">Törlés</button>
        </div>
      </div>
      <div id="deleteResult" class="mt-2"></div>
    </div>
  </div>

  <!-- JS fájl -->
  <script src="ajax.js"></script>
</body>
</html>
